# Builds the site and uploads it to the cPanel server (ndrsmartspaces.com).
# Runs on every push to main, or by hand: GitHub -> Actions -> Deploy to cPanel -> Run workflow.
# Setup (one time): docs/auto-deploy.md
name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The WebP variants (public/_img) take most of the build time. Reusing the last
      # run's set lets scripts/build-images.mjs re-encode only photos whose content changed.
      - name: Restore image variants
        uses: actions/cache@v4
        with:
          path: public/_img
          key: img-${{ hashFiles('public/images/**', 'scripts/build-images.mjs') }}
          restore-keys: img-

      - name: Build
        run: npm run build

      # The FTP secrets are scoped to the two steps below only, so the npm
      # install/build steps (which run third-party package code) never see them.
      - name: Check upload settings
        id: settings
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::Built OK but NOT uploaded: add the FTP_HOST, FTP_USER and FTP_PASSWORD secrets (see docs/auto-deploy.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to server
        if: steps.settings.outputs.ready == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Folder on the FTP account to upload into. "/" when the FTP account is
          # restricted to public_html (recommended).
          FTP_DIR: ${{ vars.FTP_DIR || '/' }}
          # The server's FTP certificate is currently self-signed and expired, so
          # strict checking is off by default (the connection is still encrypted).
          # Set the repository variable FTP_VERIFY_CERT to "yes" once it is renewed.
          FTP_VERIFY_CERT: ${{ vars.FTP_VERIFY_CERT || 'no' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          rm -rf out/videos/homepage   # unused 21 MB video
          DIR="${FTP_DIR%/}"
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate $FTP_VERIFY_CERT
          set net:max-retries 3
          set net:timeout 30
          set cmd:fail-exit true
          # --transfer-all: the pages and scripts (about 14 MB) are always re-sent. Without it
          # lftp skips a file whose size matches and whose server timestamp looks newer, which
          # left a page on the old build while its new scripts were uploaded.
          mirror -R --parallel=4 --transfer-all --verbose=1 -x ^videos/ -x ^_img/ -x ^images/ out ${DIR:-/}
          mirror -R --parallel=4 --ignore-time --verbose=1 out/videos $DIR/videos
          mirror -R --parallel=4 --ignore-time --verbose=1 out/_img $DIR/_img
          mirror -R --parallel=4 --ignore-time --verbose=1 out/images $DIR/images
          bye
          LFTP
